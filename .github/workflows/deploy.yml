name: Site aus site.zip veroeffentlichen

on:
  push:
    paths:
      - 'site.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alte Dateien entfernen und Archiv entpacken
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'site.zip' -exec rm -rf {} +
          unzip -q -o site.zip -d .
          rm -f site.zip
          echo "HTML-Dateien: $(find . -name '*.html' -not -path './.git/*' | wc -l)"

      - name: Commit und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Site aktualisiert: alle Unterordner"
          git push
